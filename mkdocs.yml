site_name: wildintel-trapper-sdk
site_description: Python client for the Trapper API (v1 and v2)
site_url: https://wildintelproject.github.io/wildintelproject-trapper-sdk/
repo_url: https://github.com/wildintelproject/wildintelproject-trapper-sdk
repo_name: wildintelproject/wildintelproject-trapper-sdk
copyright: Copyright &copy; 2026 <a href="https://wildintel.eu/">WildINTEL</a>

docs_dir: docs

validation:
  links:
    anchors: warn
site_dir: site

theme:
  name: material
  language: en
  custom_dir: overrides            # partials/logo.html shows two logos in the header
  logo: img/WildINTEL_onlyCircle_25.png
  favicon: img/WildINTEL_onlyCircle_25.png

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  sdk_logo: img/logo.png
  wildintel_logo: img/wildIntel_logo_cropped.webp
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wildintelproject/wildintelproject-trapper-sdk
      name: wildintel-trapper-sdk on GitHub
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/people/WildIntel/61556603674655/
      name: WildINTEL on Facebook
    - icon: simple/bluesky
      link: https://bsky.app/profile/wildintel.bsky.social
      name: WildINTEL on Bluesky
    - icon: fontawesome/solid/globe
      link: https://wildintel.eu/
      name: WildINTEL website

extra_css:
  - stylesheets/extras.css
  - stylesheets/termynal.css

extra_javascript:
  - javascripts/termynal.js
  - javascripts/termynal-init.js

markdown_extensions:
  - toc:
      title: On this page
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - tables
  - attr_list
  - def_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Component Guides:
      - Locations: guide/locations.md
      - Trapper versions (v1 / v2): guide/versions.md
      - Locations GeoJSON: guide/locations_geojson.md
      - Deployments: guide/deployments.md
      - Project deployments (v2): guide/project_deployments.md
      - Resources: guide/resources.md
      - Collections: guide/collections.md
      - Research Projects: guide/research_projects.md
      - Classification Projects: guide/classification_projects.md
      - Classifications: guide/classifications.md
      - AI Classifications: guide/ai_classifications.md
      - Classification Media: guide/classification_media.md
      - Classification Results Agg: guide/classification_results_agg.md
      - Classification Package: guide/classification_package.md
      - User Classifications: guide/user_classifications.md
      - Classifications Map: guide/classifications_map.md
      - Classificators: guide/classificators.md
      - Species: guide/species.md
      - Maps: guide/maps.md
      - Sequences: guide/sequences.md
      - Users: guide/users.md
  - Features: features.md
  - Testing: testing.md
  - API Reference:
      - Overview: api/index.md
      - TrapperClient: api/trapper_client.md
      - APIClientBase: api/api_client_base.md
      - APIQuery: api/api_query.md
      - TrapperComponent: api/base_component.md
      - Errors: api/errors.md
      - Components:
          - Locations: api/components/locations.md
          - Locations GeoJSON: api/components/locations_geojson.md
          - Deployments: api/components/deployments.md
          - ProjectDeployments: api/components/project_deployments.md
          - Resources: api/components/resources.md
          - Collections: api/components/collections.md
          - Research Projects: api/components/research_projects.md
          - Research Project Collections: api/components/research_project_collections.md
          - Classification Projects: api/components/classification_projects.md
          - Classifications: api/components/classifications.md
          - AI Classifications: api/components/ai_classifications.md
          - Classification Media: api/components/classification_media.md
          - Classification Results Agg: api/components/classification_results_agg.md
          - Classification Package: api/components/classification_package.md
          - User Classifications: api/components/user_classifications.md
          - Classifications Map: api/components/classifications_map.md
          - Classificators: api/components/classificators.md
          - Species: api/components/species.md
          - Maps: api/components/maps.md
          - Sequences: api/components/sequences.md
          - Users: api/components/users.md
      - Schemas:
          - Common: api/schemas/common.md
          - Locations: api/schemas/locations.md
          - Deployments: api/schemas/deployments.md
          - ProjectDeployments: api/schemas/project_deployments.md
          - Resources: api/schemas/resources.md
          - Collections: api/schemas/collections.md
          - Research Projects: api/schemas/research_projects.md
          - Classifications: api/schemas/classifications.md
          - AI Classifications: api/schemas/ai_classifications.md
          - User Classifications: api/schemas/user_classifications.md
          - Classifications Map: api/schemas/classifications_map.md
          - Classificators: api/schemas/classificators.md
          - Species: api/schemas/species.md
          - Maps: api/schemas/maps.md
          - Sequences: api/schemas/sequences.md
          - Users: api/schemas/users.md
  - About: about.md

plugins:
  - search
  - i18n:
      docs_structure: suffix          # page.md = English, page.es.md = Spanish
      fallback_to_default: true       # untranslated pages show the English text
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_description: Cliente Python para la API de Trapper (v1 y v2)
          nav_translations:
            Home: Inicio
            Installation: Instalación
            Usage: Uso
            Component Guides: Guías de componentes
            "Trapper versions (v1 / v2)": "Versiones de Trapper (v1 / v2)"
            Locations: Localizaciones
            Locations GeoJSON: Localizaciones GeoJSON
            Deployments: Despliegues
            "Project deployments (v2)": "Despliegues de proyecto (v2)"
            Resources: Recursos
            Collections: Colecciones
            Research Projects: Proyectos de investigación
            Classification Projects: Proyectos de clasificación
            Classifications: Clasificaciones
            AI Classifications: Clasificaciones de IA
            Classification Media: Medios de clasificación
            Classification Results Agg: Resultados agregados
            Classification Package: Paquete de clasificación
            User Classifications: Clasificaciones de usuario
            Classifications Map: Mapa de clasificaciones
            Classificators: Clasificadores
            Species: Especies
            Maps: Mapas
            Sequences: Secuencias
            Users: Usuarios
            Features: Características
            Testing: Pruebas
            API Reference: Referencia de la API
            About: Acerca de
  - autorefs:
      resolve_closest: true           # the API reference exists once per language
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            filters: [ "!^_" ]
